# Render Blueprint: backend (FastAPI) + frontend (static React build).
# Everything runs in MOCK_LLM mode - no API keys needed.
services:
  - type: web
    name: cred-agent-api
    runtime: python
    plan: free            # embedding model + torch are heavy; if it runs out of memory, switch to a paid plan
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_MODE
        value: MOCK_LLM

  - type: web
    name: cred-agent-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false       # set to the API URL after the first deploy, e.g. https://cred-agent-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
